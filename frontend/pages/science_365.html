<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Science Every Day 每日科學人 · 365 Days of Scientific Minds</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --cobalt:#1F35B0; --cobalt-deep:#16247E;
  --paper:#FBF7EE; --paper-dim:#F1EBDD;
  --ink:#171431; --ink-soft:#4A4763;
  --sun:#FFC53D; --coral:#FF5D47; --orange:#FF9F1C;
  --mint:#2FBE8F; --sky:#2EA8E0; --violet:#7B5CD6; --rose:#E8558E;
  --shadow:8px 8px 0 rgba(11,10,30,.35);
  --shadow-sm:4px 4px 0 rgba(11,10,30,.3);
  --shadow-xs:3px 3px 0 rgba(11,10,30,.28);
  --disp:'Archivo Black','Noto Sans TC',sans-serif;
  --body:'Space Grotesk','Noto Sans TC',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:var(--body);color:var(--ink);background:var(--cobalt);
  background-image:linear-gradient(rgba(255,255,255,.07) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.07) 1px,transparent 1px);
  background-size:28px 28px;min-height:100vh;padding-bottom:80px;
}
.wrap{max-width:940px;margin:0 auto;padding:0 16px}
button{font-family:var(--body)}

/* header */
header{padding:20px 0 6px}
.head-row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{background:var(--paper);border:3px solid var(--ink);border-radius:14px;padding:9px 15px;
  box-shadow:var(--shadow-sm);transform:rotate(-1.2deg);cursor:pointer}
.brand h1{font-family:var(--disp);font-size:clamp(16px,3.6vw,23px);line-height:1.05}
.brand h1 .sun{color:var(--cobalt)}
.brand .zh{font-size:11px;font-weight:700;color:var(--ink-soft);letter-spacing:3px;margin-top:3px}
.stats{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.chip{display:flex;align-items:center;gap:5px;background:var(--paper);border:3px solid var(--ink);
  border-radius:999px;padding:6px 13px;font-weight:700;font-size:13.5px;box-shadow:var(--shadow-xs)}
.chip b{font-size:15px}
.chip.btn{cursor:pointer;transition:transform .12s}
.chip.btn:hover{transform:translate(-1px,-1px)}
.chip.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 rgba(11,10,30,.3)}
.chip.sun-chip{background:var(--sun)}
.chip.coral-chip{background:var(--coral);color:#fff}

/* nav tabs */
.tabs{display:flex;gap:8px;margin:16px 0 6px;flex-wrap:wrap}
.tab{border:3px solid var(--ink);border-radius:12px;background:var(--paper);padding:8px 16px;
  font-weight:700;font-size:13.5px;cursor:pointer;box-shadow:var(--shadow-xs);transition:transform .12s}
.tab:hover{transform:translateY(-2px)}
.tab.on{background:var(--ink);color:var(--sun)}

/* section headings on blue */
.sec-head{color:#fff;margin:22px 0 12px}
.sec-head h2{font-family:var(--disp);font-size:clamp(19px,4vw,26px);text-shadow:3px 3px 0 rgba(0,0,0,.3)}
.sec-head p{font-weight:700;font-size:13.5px;opacity:.92;margin-top:5px;line-height:1.6}

/* YEAR VIEW */
.year-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;margin-bottom:26px}
.month-tile{border:4px solid var(--ink);border-radius:18px;background:var(--paper);box-shadow:var(--shadow-sm);
  overflow:hidden;cursor:pointer;transition:transform .14s;text-align:left}
.month-tile:hover{transform:translate(-2px,-3px);box-shadow:10px 11px 0 rgba(11,10,30,.35)}
.mt-band{padding:12px 14px;color:#fff;border-bottom:4px solid var(--ink)}
.mt-num{font-family:var(--disp);font-size:12px;opacity:.85;letter-spacing:2px}
.mt-name{font-family:var(--disp);font-size:19px;line-height:1.1;margin-top:2px}
.mt-theme{font-weight:700;font-size:12px;margin-top:4px;opacity:.95;line-height:1.4}
.mt-body{padding:11px 14px}
.mt-zh{font-size:12.5px;font-weight:700;color:var(--ink-soft);margin-bottom:8px}
.mini-bar{height:12px;border:2.5px solid var(--ink);border-radius:999px;background:var(--paper-dim);overflow:hidden}
.mini-fill{height:100%;background:repeating-linear-gradient(45deg,var(--mint) 0 9px,#27A87D 9px 18px);width:0;transition:width .5s}
.mt-count{font-size:11.5px;font-weight:900;color:var(--ink-soft);margin-top:6px}

/* MONTH VIEW */
.month-head{background:var(--paper);border:4px solid var(--ink);border-radius:18px;box-shadow:var(--shadow-sm);
  padding:16px 18px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.mh-l h2{font-family:var(--disp);font-size:22px;line-height:1.1}
.mh-l p{font-weight:700;font-size:13px;color:var(--ink-soft);margin-top:4px}
.mh-nav{display:flex;gap:7px}
.nav-btn{border:3px solid var(--ink);border-radius:11px;background:var(--sun);padding:8px 14px;
  font-family:var(--disp);font-size:13px;cursor:pointer;box-shadow:var(--shadow-xs)}
.nav-btn:hover{transform:translate(-1px,-1px)}
.nav-btn.ghost{background:var(--paper)}
.dow-row{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;margin-bottom:7px}
.dow{text-align:center;font-size:11px;font-weight:900;color:#C9D1FF;letter-spacing:1px}
.day-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;margin-bottom:24px}
.dcell{aspect-ratio:1;border:3px solid var(--ink);border-radius:12px;background:var(--paper);
  padding:5px 4px;cursor:pointer;position:relative;overflow:hidden;transition:transform .12s;
  display:flex;flex-direction:column;justify-content:space-between;box-shadow:var(--shadow-xs);text-align:left}
.dcell:hover{transform:translateY(-3px);z-index:2}
.dcell .dn{font-family:var(--disp);font-size:12px;line-height:1}
.dcell .dnm{font-size:8.5px;font-weight:700;line-height:1.15;color:var(--ink-soft);
  overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.dcell .cdot{position:absolute;top:4px;right:4px;width:8px;height:8px;border-radius:50%;border:2px solid var(--ink)}
.dcell.done{background:var(--mint)}
.dcell.done .dnm,.dcell.done .dn{color:#fff}
.dcell.today{outline:4px solid var(--sun);outline-offset:-4px}
.dcell.blank{background:transparent;border:3px dashed rgba(255,255,255,.25);box-shadow:none;cursor:default}
.dcell.blank:hover{transform:none}
@media(max-width:600px){.dcell .dnm{display:none}.dcell{aspect-ratio:1;justify-content:center;align-items:center}
  .dcell .dn{font-size:15px}}

/* DAY VIEW: card */
.back-row{margin-bottom:12px}
.sci-card{background:var(--paper);border:4px solid var(--ink);border-radius:18px;box-shadow:var(--shadow);
  overflow:hidden;margin-bottom:18px;animation:pop .4s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.95);opacity:0}to{transform:scale(1);opacity:1}}
.sci-band{padding:17px 20px 15px;color:#fff;position:relative;border-bottom:4px solid var(--ink)}
.sci-band .daytag{position:absolute;top:13px;right:15px;background:var(--paper);color:var(--ink);
  border:3px solid var(--ink);border-radius:10px;padding:3px 10px;font-family:var(--disp);font-size:12px;
  transform:rotate(4deg);box-shadow:2px 2px 0 rgba(11,10,30,.3)}
.sci-top{display:flex;align-items:center;gap:15px}
.monogram{flex:0 0 auto;width:70px;height:70px;border-radius:50%;background:var(--paper);color:var(--ink);
  border:3.5px solid var(--ink);display:flex;align-items:center;justify-content:center;
  font-family:var(--disp);font-size:23px;box-shadow:3px 3px 0 rgba(11,10,30,.35)}
.sci-name{font-family:var(--disp);font-size:clamp(19px,4.3vw,28px);line-height:1.08;text-shadow:2px 2px 0 rgba(0,0,0,.25)}
.sci-zh{font-weight:900;font-size:14.5px;opacity:.95;margin-top:2px}
.sci-meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.tag{background:rgba(255,255,255,.93);color:var(--ink);border:2.5px solid var(--ink);border-radius:999px;
  padding:3px 10px;font-size:12px;font-weight:700}
.sci-body{padding:19px 20px 21px}
.block-label{display:inline-flex;align-items:center;gap:6px;font-family:var(--disp);font-size:12px;
  letter-spacing:2px;text-transform:uppercase;background:var(--ink);color:var(--sun);
  border-radius:8px;padding:4px 11px;margin-bottom:10px}
.discovery{background:#FFF6DC;border:3px solid var(--ink);border-radius:14px;padding:13px 15px;
  font-weight:500;font-size:15px;margin-bottom:17px;box-shadow:var(--shadow-xs)}
.lvl-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:11px}
.lvl-row .hint{font-size:12.5px;font-weight:700;color:var(--ink-soft)}
.lvl-toggle{display:flex;border:3px solid var(--ink);border-radius:999px;overflow:hidden;background:var(--paper-dim)}
.lvl-toggle button{border:0;background:transparent;font-weight:700;font-size:13px;padding:6px 15px;
  cursor:pointer;color:var(--ink-soft)}
.lvl-toggle button.on{background:var(--ink);color:var(--sun)}
.story{font-size:15.5px;line-height:1.75;margin-bottom:15px}
.kw-row{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px}
.kw{background:var(--paper-dim);border:2.5px solid var(--ink);border-radius:10px;padding:4px 10px;font-size:12.5px;font-weight:700}
.kw span{color:var(--cobalt)}
.quote{border-left:6px solid var(--sun);background:#fff;border-top:3px solid var(--ink);
  border-right:3px solid var(--ink);border-bottom:3px solid var(--ink);border-radius:0 14px 14px 0;
  padding:12px 15px;margin-bottom:15px;box-shadow:var(--shadow-xs)}
.quote p{font-size:15px;font-style:italic;font-weight:500}
.q-tag{display:inline-block;margin-top:8px;font-size:11px;font-weight:900;letter-spacing:1px;
  border:2px solid var(--ink);border-radius:999px;padding:2px 10px}
.q-tag.verified{background:var(--mint);color:#fff}
.q-tag.attributed{background:var(--sun)}
.q-tag.paraphrased{background:var(--sky);color:#fff}
.life{background:#E9F7F0;border:3px solid var(--ink);border-radius:14px;padding:12px 15px;
  font-size:14.5px;line-height:1.6;box-shadow:var(--shadow-xs)}
.draft-note{display:flex;gap:10px;align-items:flex-start;background:#FFF0E6;border:3px dashed var(--ink);
  border-radius:14px;padding:12px 14px;margin-bottom:16px;font-size:13px;line-height:1.6;font-weight:500}
.draft-note b{display:block;margin-bottom:2px}

/* bloom */
.bloom{display:flex;flex-direction:column;gap:11px;margin:14px 0 8px}
.b-row{border:3.5px solid var(--ink);border-radius:16px;background:var(--paper);box-shadow:var(--shadow-sm);overflow:hidden}
.b-head{display:flex;align-items:center;gap:11px;padding:12px 15px;cursor:pointer;user-select:none}
.b-num{flex:0 0 auto;width:36px;height:36px;border-radius:11px;border:3px solid var(--ink);
  display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-size:15px;color:#fff}
.b-info{flex:1;min-width:0}
.b-name{font-weight:700;font-size:15px}
.b-name .zh{color:var(--ink-soft);font-size:12.5px;margin-left:6px}
.b-pts{font-size:11.5px;font-weight:900;color:var(--ink-soft)}
.b-state{flex:0 0 auto;font-size:19px;transition:transform .2s}
.b-row.open .b-state.arrow{transform:rotate(180deg)}
.b-row.done{outline:3px solid var(--mint);outline-offset:-3px}
.b-panel{display:none;border-top:3px dashed var(--ink);padding:15px;background:#fff}
.b-row.open .b-panel{display:block}
.b-q{font-size:15px;font-weight:500;line-height:1.6;margin-bottom:13px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;border:3px solid var(--ink);border-radius:12px;background:var(--paper);
  padding:10px 13px;font-size:14.5px;font-weight:500;cursor:pointer;transition:transform .1s}
.opt:hover:not(:disabled){transform:translateX(3px);background:#FFF6DC}
.opt.right{background:var(--mint);color:#fff;font-weight:700}
.opt.wrong{background:#FFE1DC;animation:shake .35s}
.opt:disabled{cursor:default}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.stances{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:11px}
.stance{border:3px solid var(--ink);border-radius:999px;background:var(--paper);padding:7px 15px;
  font-weight:700;font-size:13px;cursor:pointer}
.stance.on{background:var(--ink);color:var(--sun)}
textarea{width:100%;border:3px solid var(--ink);border-radius:12px;padding:10px 12px;
  font-family:var(--body);font-size:14.5px;min-height:84px;resize:vertical;background:var(--paper)}
textarea:focus{outline:3px solid var(--sun);outline-offset:2px}
input[type=text]{width:100%;border:3px solid var(--ink);border-radius:12px;padding:9px 12px;
  font-family:var(--body);font-size:14.5px;background:var(--paper)}
.starter{font-size:12.5px;font-weight:700;color:var(--ink-soft);margin-bottom:8px;line-height:1.6}
.submit-row{display:flex;align-items:center;gap:11px;margin-top:10px;flex-wrap:wrap}
.btn-main{border:3px solid var(--ink);border-radius:12px;background:var(--sun);font-family:var(--disp);
  font-size:13.5px;padding:10px 19px;cursor:pointer;box-shadow:var(--shadow-xs);transition:transform .12s}
.btn-main:hover:not(:disabled){transform:translate(-1px,-1px)}
.btn-main:active{transform:translate(2px,2px);box-shadow:1px 1px 0 rgba(11,10,30,.3)}
.btn-main:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn-main.mint{background:var(--mint);color:#fff}
.btn-main.sky{background:var(--sky);color:#fff}
.btn-main.ghost{background:var(--paper)}
.btn-main.big{font-size:15px;padding:12px 24px}
.wc{font-size:12px;font-weight:700;color:var(--ink-soft)}
.feedback{margin-top:11px;background:#EAF3FF;border:3px solid var(--ink);border-radius:12px;
  padding:11px 13px;font-size:13.5px;line-height:1.6;display:none}
.feedback.show{display:block;animation:pop .3s}
.feedback b{color:var(--cobalt)}

.day-progress{margin:18px 0 30px;background:var(--paper);border:4px solid var(--ink);border-radius:18px;
  box-shadow:var(--shadow);padding:17px 19px;display:flex;align-items:center;gap:15px;flex-wrap:wrap}
.prog-bar{flex:1;min-width:170px;height:19px;border:3px solid var(--ink);border-radius:999px;
  background:var(--paper-dim);overflow:hidden}
.prog-fill{height:100%;width:0;background:repeating-linear-gradient(45deg,var(--mint) 0 12px,#27A87D 12px 24px);
  transition:width .5s;border-radius:999px}
.prog-txt{font-weight:900;font-size:14px}
.collect-note{font-size:12.5px;font-weight:700;color:var(--ink-soft);width:100%;line-height:1.6}

/* PATHS */
.path-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:13px;margin-bottom:26px}
.path{border:4px solid var(--ink);border-radius:18px;background:var(--paper);box-shadow:var(--shadow-sm);
  overflow:hidden;cursor:pointer;transition:transform .14s;text-align:left}
.path:hover{transform:translate(-2px,-3px)}
.path-band{padding:13px 15px;color:#fff;border-bottom:4px solid var(--ink);display:flex;gap:11px;align-items:center}
.path-ico{font-size:27px}
.path-band .pt{font-family:var(--disp);font-size:15.5px;line-height:1.15}
.path-band .pz{font-size:11.5px;font-weight:700;opacity:.95;margin-top:2px}
.path-body{padding:11px 15px}
.path-body p{font-size:12.5px;line-height:1.55;color:var(--ink-soft);font-weight:500;margin-bottom:9px}

/* LIST (path detail / search) */
.list{display:flex;flex-direction:column;gap:8px;margin-bottom:26px}
.li{display:flex;gap:12px;align-items:center;border:3px solid var(--ink);border-radius:13px;
  background:var(--paper);padding:9px 13px;box-shadow:var(--shadow-xs);cursor:pointer;transition:transform .1s;text-align:left}
.li:hover{transform:translateX(4px)}
.li-date{flex:0 0 auto;width:56px;text-align:center;border-right:3px solid var(--ink);padding-right:9px}
.li-date .m{font-size:10px;font-weight:900;color:var(--ink-soft);letter-spacing:1px}
.li-date .d{font-family:var(--disp);font-size:17px;line-height:1}
.li-main{flex:1;min-width:0}
.li-main .n{font-weight:700;font-size:14.5px;line-height:1.25}
.li-main .s{font-size:11.5px;font-weight:700;color:var(--ink-soft);margin-top:2px}
.li-chk{flex:0 0 auto;font-size:17px}

/* COLLECTION / modal */
.overlay{position:fixed;inset:0;background:rgba(15,13,40,.75);display:none;align-items:flex-start;
  justify-content:center;padding:26px 14px;z-index:60;overflow-y:auto}
.overlay.show{display:flex}
.modal{background:var(--paper);border:4px solid var(--ink);border-radius:20px;box-shadow:var(--shadow);
  width:min(820px,100%);padding:22px;animation:pop .3s}
.modal h2{font-family:var(--disp);font-size:21px;margin-bottom:4px}
.modal h3{font-family:var(--disp);font-size:16px;margin:20px 0 4px}
.modal .sub{font-weight:700;color:var(--ink-soft);font-size:13px;margin-bottom:16px;line-height:1.6}
.close-x{float:right;border:3px solid var(--ink);background:var(--coral);color:#fff;border-radius:10px;
  font-family:var(--disp);font-size:13px;padding:6px 12px;cursor:pointer;box-shadow:var(--shadow-xs)}
.badge-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(195px,1fr));gap:10px}
.badge{display:flex;gap:10px;align-items:center;border:3px solid var(--ink);border-radius:14px;
  padding:10px 12px;background:#fff;box-shadow:var(--shadow-xs)}
.badge .b-ico{font-size:25px}
.badge .b-t{font-weight:900;font-size:12.5px}
.badge .b-d{font-size:11px;font-weight:500;color:var(--ink-soft);line-height:1.4}
.badge.locked{opacity:.4;filter:grayscale(1)}
.world{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.wc-item{border:3px solid var(--ink);border-radius:12px;padding:8px;text-align:center;background:#fff;box-shadow:var(--shadow-xs)}
.wc-item .f{font-size:21px}
.wc-item .n{font-size:10.5px;font-weight:900;margin-top:3px;line-height:1.25}
.wc-item .c{font-size:10px;font-weight:700;color:var(--ink-soft)}
.wc-item.dim{opacity:.35;filter:grayscale(1)}

/* studio */
.field{margin-bottom:13px}
.field label{display:block;font-size:12px;font-weight:900;letter-spacing:1px;text-transform:uppercase;
  color:var(--ink-soft);margin-bottom:5px}
.field .help{font-size:11.5px;font-weight:500;color:var(--ink-soft);margin-top:4px;line-height:1.5}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:560px){.two-col{grid-template-columns:1fr}}
pre.out{background:var(--ink);color:#9DE7C6;border-radius:12px;padding:13px;font-size:11.5px;
  overflow-x:auto;max-height:260px;line-height:1.5;white-space:pre-wrap;word-break:break-word}

/* toast + confetti */
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(130px);
  background:var(--ink);color:var(--sun);border:3px solid var(--sun);border-radius:14px;
  padding:11px 20px;font-weight:900;font-size:14px;z-index:90;
  transition:transform .35s cubic-bezier(.2,1.3,.4,1);box-shadow:0 10px 30px rgba(0,0,0,.4);
  max-width:88vw;text-align:center}
#toast.show{transform:translateX(-50%) translateY(0)}
.confetti{position:fixed;top:-12px;width:10px;height:16px;z-index:80;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:.9}}

footer{color:#C9D1FF;text-align:center;font-size:12px;font-weight:700;margin-top:24px;line-height:1.8}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}

</style>

</head>
<body>
<div class="wrap">
  <header>
    <div class="head-row">
      <div class="brand" id="brandHome">
        <h1>SCIENCE<br>EVERY <span class="sun">DAY</span></h1>
        <div class="zh">每日科學人 · 365</div>
      </div>
      <div class="stats">
        <div class="chip sun-chip">⭐<b id="ptsVal">0</b>&nbsp;pts</div>
        <div class="chip coral-chip">🔥<b id="streakVal">0</b>&nbsp;streak</div>
        <div class="chip btn" id="collBtn">🃏<b id="collCount">0</b>/<span id="collTot">365</span></div>
      </div>
    </div>

/* build the 365 entries */
const DAYS=[];
for(let m=1;m<=12;m++){
  (R[m]||[]).forEach((row,i)=>{
    const p=row.split('|');
    const key=m+'-'+(i+1);
    const d=DEEP[key]||{};
    DAYS.push({
      m, d:i+1, key,
      name:p[0], zh:p[1], country:p[2], years:p[3], field:p[4], cat:p[5], disc:p[6],
      deep:!!DEEP[key],
      kw:d.kw, story:d.story, quote:d.quote, life:d.life, bloom:d.bloom
    });
  });
}
const byKey=k=>DAYS.find(x=>x.key===k);
const TOTAL=DAYS.length;   // 365 + one leap-day bonus card
document.getElementById('collTot').textContent=TOTAL;

/* monogram from name */
function mono(e){
  if(CAT[e.cat].ico && (e.cat==='team'||e.cat==='event'||e.cat==='ethics')) return CAT[e.cat].ico;
  const w=e.name.replace(/[^A-Za-z '’-]/g,'').trim().split(/\s+/).filter(Boolean);
  if(!w.length) return '★';
  if(w.length===1) return w[0].slice(0,2).toUpperCase();
  return (w[0][0]+w[w.length-1][0]).toUpperCase();
}

function confetti(color){

/* ============ AUTO SCAFFOLD ============ */
function autoStory(e){
  return {
   A2:`${e.name} — ${e.zh}. From ${e.country.replace(/^\S+\s/,'')}, ${e.years}. Field: ${e.field}. In simple words: ${e.disc.toLowerCase()}. Read the card, then try the tasks below. ✍️ This card is waiting for a full A2 story — write one in the Studio.`,
   B1:`${e.name} (${e.zh}) worked in ${e.field.toLowerCase()} — ${e.country.replace(/^\S+\s/,'')}, ${e.years}. ${e.disc}. This entry currently shows the verified summary only; the full B1 narrative has not been written yet. Use the Studio to draft it, or write it yourself as a science-communication task.`,
   B2:`${e.name} (${e.zh}), ${e.country.replace(/^\S+\s/,'')}, ${e.years}, ${e.field}. ${e.disc}. This is a roster entry rather than an authored card. A complete B2 version would add historical context, name the collaborators and institutions involved, and identify at least one contested or overlooked aspect of the story — exactly the kind of writing this platform asks students to produce.`
  };
}
/* Remember MCQ built from real roster data — distractors are other people's real contributions */
function autoRemember(e){
  const pool=DAYS.filter(x=>x.key!==e.key&&x.cat===e.cat);
  const src=pool.length>=3?pool:DAYS.filter(x=>x.key!==e.key);
  const picks=[];const used=new Set();
  while(picks.length<3&&picks.length<src.length){
    const c=src[Math.floor(Math.random()*src.length)];
    if(used.has(c.key))continue;used.add(c.key);
    picks.push(c.disc.length>90?c.disc.slice(0,88)+'…':c.disc);
  }
  const correct=e.disc.length>90?e.disc.slice(0,88)+'…':e.disc;
  const opts=[correct,...picks];
  for(let i=opts.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[opts[i],opts[j]]=[opts[j],opts[i]];}
  return {q:`Which contribution belongs to ${e.name}?`,opts,correct:opts.indexOf(correct)};
}
function autoBloom(e){
  const n=e.name;
  return {
   remember:autoRemember(e),
   understand:{q:`In your own words, explain what ${n} contributed — as if to a 10-year-old who has never heard the name.`,
     starter:'Avoid technical words. One clear sentence beats three vague ones.'},
   apply:{q:`Where might you meet this work in everyday life, at home, on campus, or in Taiwan? Give one concrete example.`,
     starter:'Be specific: name an object, a place, or a moment in your day.'},
   analyze:{q:`Compare this card with one you have already collected. What do the two have in common, and where do they differ — in method, in era, or in who received the credit?`,
     starter:'Try: "Both … , but whereas X … , Y … ."'},
   evaluate:{q:`Judge the significance of this contribution. Take a stance and defend it with a reason in 1–3 English sentences.`,
     stances:['Major impact','Moderate impact','Overrated'],starter:'I would rate this as ___ because…'},
   create:{q:`Create a 30-second spoken introduction to ${n} for a general audience. Open with a hook, not a date.`,
     starter:'Hooks work: a question, a surprising image, or "Imagine a world without…"'}
  };
}

function renderBloom(e){
  const bl=$('#bl');if(!bl)return;bl.innerHTML='';
  const B=getBloom(e);
  BLOOM.forEach(b=>{
    const done=!!state.progress[e.key][b.key];
    const isMcq=!!(B[b.key]&&B[b.key].opts);
    const row=document.createElement('div');
    row.className='b-row'+(done?' done':'');
    row.innerHTML=`<div class="b-head">
      <div class="b-num" style="background:${b.color}">${b.n}</div>
      <div class="b-info"><div class="b-name">${b.name}<span class="zh">${b.zh}</span></div>

      <div class="b-state ${done?'':'arrow'}">${done?'✅':'▾'}</div></div>
      <div class="b-panel" id="p-${b.key}"></div>`;
    bl.appendChild(row);
    row.querySelector('.b-head').onclick=()=>{
      const was=row.classList.contains('open');
      bl.querySelectorAll('.b-row').forEach(r=>r.classList.remove('open'));
      if(!was){row.classList.add('open');buildPanel(e,b);}

function buildPanel(e,b){
  const p=$('#p-'+b.key);if(!p||p.dataset.built)return;p.dataset.built='1';
  const data=getBloom(e)[b.key];
  const saved=state.progress[e.key][b.key];

  if(data.opts){
    p.innerHTML=`<p class="b-q">${esc(data.q)}</p><div class="opts"></div>`;
    const box=p.querySelector('.opts');
    data.opts.forEach((t,i)=>{
      const btn=document.createElement('button');
      btn.className='opt';btn.textContent=t;btn.disabled=!!saved;
      if(saved&&i===data.correct)btn.classList.add('right');
      btn.onclick=()=>{
        if(state.progress[e.key][b.key])return;
        if(i===data.correct){btn.classList.add('right');
          box.querySelectorAll('.opt').forEach(o=>o.disabled=true);mark(e,b,true);}
        else{btn.classList.add('wrong');btn.disabled=true;toast('Not quite — try another 再試一次');}
      };
      box.appendChild(btn);
    });
    return;
  }

  const stancesHTML=data.stances?`<div class="stances" id="s-${b.key}">${
    data.stances.map(s=>`<button class="stance" data-s="${esc(s)}">${esc(s)}</button>`).join('')}</div>`:'';
  p.innerHTML=`<p class="b-q">${esc(data.q)}</p>${stancesHTML}
    <p class="starter">✏️ ${esc(data.starter||'Write in full sentences.')}</p>
    <textarea id="t-${b.key}" placeholder="Write your response in English…" ${saved?'disabled':''}>${saved?esc(saved.text||''):''}</textarea>
    <div class="submit-row">
      <button class="btn-main mint" id="sb-${b.key}" ${saved?'disabled':''}>${saved?'✓ Submitted':'Get coach feedback →'}</button>
      <span class="wc" id="w-${b.key}">0 words</span></div>
    <div class="feedback ${saved?'show':''}" id="f-${b.key}">${saved?saved.fb||'':''}</div>`;

  let stance=null;
  if(data.stances){p.querySelector('#s-'+b.key).onclick=ev=>{
    const btn=ev.target.closest('.stance');if(!btn||saved)return;stance=btn.dataset.s;
    p.querySelectorAll('.stance').forEach(x=>x.classList.toggle('on',x===btn));};}
  const ta=p.querySelector('#t-'+b.key),wc=p.querySelector('#w-'+b.key);
  ta.oninput=()=>{const n=ta.value.trim()?ta.value.trim().split(/\s+/).length:0;
    wc.textContent=n+' word'+(n===1?'':'s');};
  p.querySelector('#sb-'+b.key).onclick=()=>{
    if(state.progress[e.key][b.key])return;
    const text=ta.value.trim(),words=text?text.split(/\s+/).length:0;
    if(data.stances&&!stance){toast('Pick a stance first 先選立場');return;}
    if(words<6){toast('Write at least 6 words ✍️');return;}
    const fb=coach(b.key,text,words);
    const fbx=p.querySelector('#f-'+b.key);fbx.innerHTML=fb;fbx.classList.add('show');
    ta.disabled=true;const sb=p.querySelector('#sb-'+b.key);sb.textContent='✓ Submitted';sb.disabled=true;
    if(b.key==='evaluate')state.evals++;
    if(b.key==='create')state.creates++;
    mark(e,b,true,{text,fb});
  };
}

/* coach: scaffolds language, never assigns a score */
function coach(key,text,words){
  const l=text.toLowerCase();
  const reason=/because|since|so that|as a result|therefore|due to|which means/.test(l);
  const example=/example|for instance|such as|like when|imagine|in taiwan|every time/.test(l);
  const hedge=/however|although|on the other hand|but |while /.test(l);
  let a,b;
  if(key==='evaluate'){
    a=reason?'You supported your stance with a reason — that is the core move of an Evaluate task.'
            :'Add the word <b>because</b> and give one reason for the stance you chose.';
    b=hedge?'You also acknowledged another side, which strengthens the judgement.'
           :'Now add one clause beginning <b>Although…</b> or <b>However…</b> to show you considered the other side.';
  }else if(key==='create'){
    a=example?'Good — you used something concrete, which is what makes science communication land.'
             :'Add one concrete image or example a listener can picture.';
    b=words<25?'Expand to 2–3 full sentences so the idea has room to breathe.'
              :'Good length. Read it aloud — does it sound like speech, or like a textbook?';
  }else if(key==='analyze'){
    a=/both|whereas|while|differ|similar|unlike/.test(l)?'You used comparison language — exactly right for Analyze.'
      :'Use explicit comparison signals: <b>Both… but whereas… </b>';
    b='Push further: name <b>one difference in method or era</b>, not only in topic.';
  }else if(key==='apply'){
    a=example?'You named something concrete — that is what Apply asks for.'
             :'Name a specific object, place or moment rather than a general area.';
    b='Add a second sentence explaining <b>how</b> the connection actually works.';
  }else{
    a=words<15?'Try one more sentence — a 10-year-old needs a little more.'
              :'Reasonable length for a simple explanation.';
    b=/[A-Z][a-z]+ology|physics|chemistry|molecul|quantum/.test(text)
      ?'Check for jargon: could you swap the technical word for an everyday one?'
      :'Nice plain language. Now check: is every sentence something a child could picture?';
  }
  return `<b>Coach:</b> ${a}<br>👉 ${b}<br><span style="color:#4A4763">No score is given here. Revise it, then take it to a partner or your teacher.</span>`;
}

function mark(e,b,ok,extra){
  state.progress[e.key][b.key]=extra||true;
  addPoints(b.pts);
  /* update this row in place — re-rendering would collapse the open panel
     and destroy the coach feedback the moment it appeared */
  const bl=$('#bl'), idx=BLOOM.findIndex(x=>x.key===b.key), row=bl&&bl.children[idx];
  if(row){
    row.classList.add('done');
    const st=row.querySelector('.b-state');
    st.textContent='✅'; st.classList.remove('arrow');
  }
  updateProg(e);
  toast(`✅ ${b.name} complete +${b.pts} pts`);
}
function updateProg(e){
  const n=doneCount(e.key),f=$('#pf'),t=$('#pn');
  if(f){f.style.width=(n/6*100)+'%';t.textContent=n;}
  if(n>=3&&!state.cards.has(e.key))collect(e);
}
function collect(e){
  state.cards.add(e.key);
  $('#collCount').textContent=state.cards.size;
  $('#streakVal').textContent=state.cards.size;
  confetti(CAT[e.cat].c);
  toast(`🃏 Collected ${e.name}!`);
  checkBadges();
}

 {id:'classic',ico:'📜',t:'The Canon',zh:'經典人物',c:'#1F35B0',
  d:'The names most curricula already include — best read alongside the Overlooked path.',f:e=>e.cat==='classic'},
 {id:'deep',ico:'⭐',t:'Fully Authored Cards',zh:'完整撰寫的卡片',c:'#FFC53D',
  d:'Days with hand-written A2/B1/B2 stories and custom Bloom questions. Start here to see the target quality.',f:e=>e.deep}
];

function viewPaths(){
  stage.innerHTML=`<div class="sec-head"><h2>🧭 Learning Paths</h2>
    <p>Cross-cutting collections that run through the whole year, so a theme can be taught in one week or followed all year 主題可貫穿全年，也可濃縮為單週課程</p></div>
    <div class="path-grid">${PATHS.map(p=>{
      const days=DAYS.filter(p.f);const got=days.filter(d=>state.cards.has(d.key)).length;
      return `<button class="path" data-p="${p.id}">
        <div class="path-band" style="background:${p.c}"><div class="path-ico">${p.ico}</div>
          <div><div class="pt">${p.t}</div><div class="pz">${p.zh} · ${days.length} days</div></div></div>
        <div class="path-body"><p>${p.d}</p>
          <div class="mini-bar"><div class="mini-fill" style="width:${got/days.length*100}%"></div></div>
          <div class="mt-count">${got} / ${days.length} collected</div></div></button>`;}).join('')}
    </div>`;
  stage.querySelectorAll('.path').forEach(b=>b.onclick=()=>viewPath(b.dataset.p));
}
function viewPath(id){
  const p=PATHS.find(x=>x.id===id),days=DAYS.filter(p.f);
  stage.innerHTML=`<div class="month-head"><div class="mh-l"><h2>${p.ico} ${p.t}</h2>
    <p>${p.zh} · ${days.length} cards across the year</p></div>
    <div class="mh-nav"><button class="nav-btn ghost" id="bp">← All paths</button></div></div>
    <div class="list">${days.map(e=>listItem(e)).join('')}</div>`;
  $('#bp').onclick=()=>viewPaths();
  bindList();
  window.scrollTo({top:0,behavior:'smooth'});
}
function listItem(e){
  return `<button class="li" data-k="${e.key}">
    <div class="li-date"><div class="m">${MONTHS[e.m-1].n.slice(0,3).toUpperCase()}</div><div class="d">${e.d}</div></div>
    <div class="li-main"><div class="n">${esc(e.name)}${e.deep?' ⭐':''}</div>
      <div class="s">${esc(e.zh)} · ${esc(e.field)} · ${esc(e.country)}</div></div>
    <div class="li-chk">${state.cards.has(e.key)?'✅':'○'}</div></button>`;
}
function bindList(){stage.querySelectorAll('.li[data-k]').forEach(b=>b.onclick=()=>openDay(b.dataset.k));}

/* ============ SEARCH ============ */
function viewSearch(){
  stage.innerHTML=`<div class="sec-head"><h2>🔍 Find a scientist</h2>
    <p>Search all 365 by name, field, country or Chinese name 可用姓名、領域、國家或中文檢索</p></div>
    <div class="month-head"><input type="text" id="q" placeholder="e.g. Taiwan, genetics, 女性, Curie, ethics…" autocomplete="off"></div>
    <div class="list" id="res"></div>`;
  const q=$('#q'),res=$('#res');
  const run=()=>{
    const v=q.value.trim().toLowerCase();
    if(!v){res.innerHTML=`<div class="draft-note" style="background:var(--paper)">🔎<div>Type anything above. Try <b>Taiwan</b>, <b>overlooked</b>, <b>vaccine</b>, or a Chinese name.</div></div>`;return;}
    const hits=DAYS.filter(e=>(e.name+e.zh+e.field+e.country+e.disc+e.cat).toLowerCase().includes(v)).slice(0,60);
    res.innerHTML=hits.length?hits.map(listItem).join('')
      :`<div class="draft-note" style="background:var(--paper)">😕<div>No match for "<b>${esc(q.value)}</b>". Try a broader word — a field, a country, or a category like <b>ethics</b>.</div></div>`;
    bindList();
  };
  q.oninput=run;run();q.focus();
}

/* ============ STUDIO ============ */
function viewStudio(){
  const unwritten=DAYS.filter(e=>!e.deep&&!state.authored[e.key]).length;
  stage.innerHTML=`<div class="sec-head"><h2>✍️ Authoring Studio</h2>
    <p>${TOTAL-unwritten} of ${TOTAL} cards have full stories. Writing the rest is the curriculum, not the obstacle — this is where students become the authors. 學生撰寫卡片本身就是科學傳播任務。</p></div>
    <div class="month-head" style="display:block">
      <div class="field"><label>Pick a day 選擇日期</label>
        <select id="pick" style="width:100%;border:3px solid var(--ink);border-radius:12px;padding:9px 12px;font-family:var(--body);font-size:14.5px;background:var(--paper)"></select>
        <div class="help">Days already written show ⭐. Anything you write here appears immediately on that day's card.</div></div>
      <div class="field"><label>A2 story — 80–100 words, short sentences</label>
        <textarea id="a2" placeholder="Simple present, everyday vocabulary, one idea per sentence…"></textarea></div>
      <div class="field"><label>B1 story — 120–150 words, add cause and effect</label>
        <textarea id="b1" placeholder="Explain why it mattered, and connect the discovery to a consequence…"></textarea></div>
      <div class="field"><label>B2 story — 180–220 words, add context and contest</label>
        <textarea id="b2" placeholder="Add historical context, name collaborators, and identify what is disputed or overlooked…"></textarea></div>
      <div class="submit-row">
        <button class="btn-main mint" id="save">Save to this day</button>
        <button class="btn-main sky" id="draft">Load roster facts as a starting draft</button>
        <button class="btn-main ghost" id="exp">Export all as JSON</button>
      </div>
    </div>
    <div id="expOut"></div>
    <div class="sec-head"><h2>📋 Writing checklist</h2>
      <p>The house style for every card — worth giving to students as the rubric</p></div>
    <div class="month-head" style="display:block">
      <div style="font-size:14px;line-height:1.9">
      ✅ <b>No lone geniuses.</b> Name at least one collaborator, predecessor, or institution.<br>
      ✅ <b>Say who was overlooked</b>, if anyone was, and say it plainly.<br>
      ✅ <b>One life connection</b> a student could point at today.<br>
      ✅ <b>Tag every quote</b> as verified, attributed, or paraphrased — never guess.<br>
      ✅ <b>Social conditions matter.</b> What made this discovery possible at that time and place?<br>
      ✅ <b>A2 is not baby language.</b> Short sentences, real content.
      </div>
    </div>`;
  const sel=$('#pick');
  sel.innerHTML=DAYS.map(e=>`<option value="${e.key}">${MONTHS[e.m-1].n.slice(0,3)} ${e.d} — ${e.name}${(e.deep||state.authored[e.key])?' ⭐':''}</option>`).join('');
  sel.value=state.curKey||(TODAY.m+'-'+TODAY.d);
  const load=()=>{const e=byKey(sel.value);const s=state.authored[e.key]||e.story||{A2:'',B1:'',B2:''};
    $('#a2').value=s.A2||'';$('#b1').value=s.B1||'';$('#b2').value=s.B2||'';};
  sel.onchange=load;load();
  $('#draft').onclick=()=>{const e=byKey(sel.value),a=autoStory(e);
    $('#a2').value=`${e.name} (${e.zh}) — ${e.country}, ${e.years}. ${e.disc}`;
    $('#b1').value=`${e.disc} `;$('#b2').value=`${e.disc} `;
    toast('Facts loaded — now write it properly ✍️');};
  $('#save').onclick=()=>{
    const e=byKey(sel.value);
    const A2=$('#a2').value.trim(),B1=$('#b1').value.trim(),B2=$('#b2').value.trim();
    if(!A2||!B1||!B2){toast('All three levels are needed 三個程度都要填');return;}
    state.authored[e.key]={A2,B1,B2};
    addPoints(60);confetti('#FFC53D');
    toast(`✍️ ${e.name} authored! +60 pts`);
    checkBadges();
    sel.innerHTML=DAYS.map(x=>`<option value="${x.key}">${MONTHS[x.m-1].n.slice(0,3)} ${x.d} — ${x.name}${(x.deep||state.authored[x.key])?' ⭐':''}</option>`).join('');
    sel.value=e.key;
  };
  $('#exp').onclick=()=>{
    const out=Object.keys(state.authored).map(k=>{const e=byKey(k);
      return {day:`${MONTHS[e.m-1].n} ${e.d}`,name:e.name,zh:e.zh,story:state.authored[k]};});
    $('#expOut').innerHTML=out.length
      ?`<pre class="out">${esc(JSON.stringify(out,null,1))}</pre>`
      :`<div class="draft-note" style="background:var(--paper)">📭<div>Nothing authored in this session yet. Write a card above, then export.</div></div>`;
  };
}

/* ============ BADGES & COLLECTION ============ */
const BADGES=[
 {id:'first',ico:'🌱',t:'First Card',d:'Collect any one card',f:s=>s.cards.size>=1},
 {id:'ten',ico:'🔟',t:'Ten Minds',d:'Collect 10 cards',f:s=>s.cards.size>=10},
 {id:'month',ico:'🗓️',t:'Month Complete',d:'Collect every card in one month',
   f:s=>MONTHS.some((m,i)=>{const d=DAYS.filter(x=>x.m===i+1);return d.every(x=>s.cards.has(x.key));})},
 {id:'women',ico:'👩‍🔬',t:'Hidden Figures',d:'Collect 5 women-in-science cards',
   f:s=>DAYS.filter(e=>e.cat==='women'&&s.cards.has(e.key)).length>=5},
 {id:'taiwan',ico:'🏝️',t:'Taiwan Focus',d:'Collect 5 Asia & Taiwan cards',
   f:s=>DAYS.filter(e=>e.cat==='asia'&&s.cards.has(e.key)).length>=5},
 {id:'overlooked',ico:'🔦',t:'Credit Where Due',d:'Collect 5 overlooked-figure cards',
   f:s=>DAYS.filter(e=>e.cat==='overlooked'&&s.cards.has(e.key)).length>=5},
 {id:'ethics',ico:'⚖️',t:'Critical Thinker',d:'Submit 10 Evaluate responses',f:s=>s.evals>=10},
 {id:'creator',ico:'✍️',t:'Science Communicator',d:'Submit 10 Create responses',f:s=>s.creates>=10},
 {id:'author',ico:'📝',t:'Card Author',d:'Write a full card in the Studio',f:s=>Object.keys(s.authored).length>=1},
 {id:'author5',ico:'📚',t:'Staff Writer',d:'Author 5 cards',f:s=>Object.keys(s.authored).length>=5},
 {id:'world',ico:'🌍',t:'Around the World',d:'Collect cards from 15 countries',f:s=>countries().got>=15},
 {id:'year',ico:'🏆',t:'A Full Year',d:'Collect every card in the year',f:s=>s.cards.size>=TOTAL}
];
function checkBadges(){
  BADGES.forEach(b=>{if(!state.earned.has(b.id)&&b.f(state)){
    state.earned.add(b.id);setTimeout(()=>toast(`🏅 Badge unlocked: ${b.t}`),700);}});
}
function countries(){
  const all=new Map();
  DAYS.forEach(e=>{const f=e.country.split(' ')[0];
    if(!all.has(f))all.set(f,{flag:f,name:e.country.replace(/^\S+\s/,''),n:0,got:0});
    all.get(f).n++;if(state.cards.has(e.key))all.get(f).got++;});
  const list=[...all.values()].sort((a,b)=>b.n-a.n);
  return {list,got:list.filter(x=>x.got>0).length,total:list.length};
}
function openCollection(){
  const c=countries();
  $('#ovBody').innerHTML=`<button class="close-x" id="cx">✕ Close</button>
    <h2>🃏 Collection</h2>
    <p class="sub">${state.cards.size} of 365 cards · ${c.got} of ${c.total} places · ${state.earned.size} of ${BADGES.length} badges</p>
    <h3>🌍 World Map 世界地圖</h3><p class="sub">Places light up as you collect cards from them</p>
    <div class="world">${c.list.map(x=>`<div class="wc-item${x.got?'':' dim'}">
      <div class="f">${x.flag}</div><div class="n">${esc(x.name)}</div>
      <div class="c">${x.got}/${x.n}</div></div>`).join('')}</div>
    <h3>🏅 Badges 徽章</h3><p class="sub">Earned through consistency, curiosity, judgement and creation</p>
    <div class="badge-grid">${BADGES.map(b=>`<div class="badge${state.earned.has(b.id)?'':' locked'}">
      <div class="b-ico">${b.ico}</div><div><div class="b-t">${b.t}</div><div class="b-d">${b.d}</div></div></div>`).join('')}</div>`;
  $('#ov').classList.add('show');
  $('#cx').onclick=()=>$('#ov').classList.remove('show');
}

/* ============ WIRING ============ */
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>setView(t.dataset.v));
$('#collBtn').onclick=openCollection;
$('#brandHome').onclick=()=>setView('year');
$('#ov').onclick=e=>{if(e.target.id==='ov')$('#ov').classList.remove('show');};
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#ov').classList.remove('show');});

setView('year');
toast(`Today is ${MONTHS[TODAY.m-1].n} ${TODAY.d} — tap ⭐ Today to begin`);

</script>
</body>
</html>
